components:
  schemas:
    CostaRicaIBAN:
      type: string
      description: Costa Rican IBAN number
      pattern: ^CR\d{20}$
      example: CR02010200000000000001
    CostaRicaPhone:
      type: string
      description: Costa Rican phone number (8 digits starting with 6, 7, or 8, optionally prefixed with 506 country code)
      pattern: ^(506)?[678]\d{7}$
      example: '88881234'
    CostaRicaNationalID:
      type: string
      description: Costa Rican national ID (Cédula)
      pattern: ^\d{9,10}$
      example: '0123456789'
    DocumentIdentifier:
      type: string
      description: Raw document identifier. Accepts national ID, DIMEX, government ID, legal entity ID, autonomous institution ID, DIDI, or passport.
      pattern: ^((0[1-9]|[1-9])\d{8}|1\d{11}|2\d{9}|3\d{9}|4\d{9}|5\d{11}|[A-Za-z0-9]{6,19})$
      example: '111090807'
    PaymentStatus:
      type: string
      enum:
        - pending
        - processing
        - completed
        - failed
        - timeout
        - service_unavailable
        - validation_failed
        - system_error
    TransferType:
      type: string
      enum:
        - debit
        - credit
    PaymentType:
      type: string
      enum:
        - pin
        - sinpe
    AccountOrigin:
      type: string
      enum:
        - loans
        - special_savings
        - payroll_deduction_savings
        - credit_card
        - bank_ledger
    AccountStatus:
      type: string
      enum:
        - inactive
        - active
        - closed
    PhoneVerificationStatus:
      type: string
      enum:
        - registered
        - not_registered
    IBANStatus:
      type: string
      enum:
        - active
        - closed
        - blocked
    AccountDetailsResource:
      type: object
      properties:
        id:
          type: string
        document_number:
          type: string
        document_type:
          type: string
        iban:
          type: string
        origin_code:
          type: string
        balance:
          type: object
          properties:
            value:
              type: integer
              description: Amount in minor units of the currency. For example, 1000 is equivalent to 10.00.
              example: 1000
            currency:
              type: string
            formatted:
              type: string
          required:
            - value
            - currency
            - formatted
        owner_name:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - document_number
        - document_type
        - iban
        - origin_code
        - balance
        - owner_name
        - status
        - created_at
        - updated_at
      title: AccountDetailsResource
    AccountResource:
      type: object
      properties:
        id:
          type: string
        iban:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - iban
        - currency
        - created_at
        - updated_at
      title: AccountResource
    AccountWithBalanceResource:
      type: object
      properties:
        iban:
          type: string
        currency:
          type: string
        balance:
          type: integer
          description: Amount in minor units of the currency. For example, 1000 is equivalent to 10.00.
          example: 1000
        formatted:
          type: string
      required:
        - iban
        - currency
        - balance
        - formatted
      title: AccountWithBalanceResource
    CreateAccountRequest:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
      required:
        - currency
      title: CreateAccountRequest
    Currency:
      type: string
      enum:
        - CRC
        - USD
      title: Currency
    PaymentResource:
      type: object
      properties:
        id:
          type: string
          description: Identifiers
        idempotency_key:
          type: string
        cgp_ref_number:
          type: integer
        channel_reference:
          type: string
        sinpe_reference:
          type: string
        transfer_type:
          type: string
          description: Transfer direction.
          enum:
            - credit
            - debit
        status:
          type: string
        amount:
          type: object
          properties:
            value:
              type: integer
              description: Amount in minor units of the currency. For example, 1000 is equivalent to 10.00.
              example: 10000
            currency:
              type: string
            formatted:
              type: string
          required:
            - value
            - currency
            - formatted
        fee:
          type:
            - object
            - 'null'
          description: Fee amount for the payment. This can be null while the payment status is pending or processing, and is only defined once the payment is completed.
          properties:
            value:
              type: integer
              description: Amount in minor units of the currency. For example, 1000 is equivalent to 10.00.
              example: 100
            currency:
              type: string
            formatted:
              type: string
          required:
            - value
            - currency
            - formatted
        payer:
          type: object
          description: Payer and Payee
          properties:
            iban:
              type: string
            document_number:
              type: string
            document_type:
              type: integer
            name:
              type: string
          required:
            - iban
            - document_number
            - document_type
            - name
        payee:
          type: object
          properties:
            document_number:
              type: string
            document_type:
              type: integer
            name:
              type: string
            phone_number:
              type: string
            iban:
              type: string
          required:
            - document_number
            - document_type
            - name
            - iban
        description:
          type:
            - string
            - 'null'
          description: Messages
        reference:
          type:
            - string
            - 'null'
        error_message:
          type:
            - string
            - 'null'
        created_at:
          type: string
          description: Dates
        submitted_at:
          type: string
        completed_at:
          type: string
        channel:
          type: string
          description: Payment channel.
          enum:
            - pin
            - sinpe_movil
      required:
        - id
        - idempotency_key
        - cgp_ref_number
        - channel_reference
        - sinpe_reference
        - transfer_type
        - status
        - amount
        - fee
        - payer
        - payee
        - description
        - reference
        - error_message
        - created_at
        - submitted_at
        - completed_at
        - channel
      title: PaymentResource
    SendPaymentRequest:
      type: object
      properties:
        source_account_id:
          type: string
          format: uuid
        recipient_iban:
          type:
            - string
            - 'null'
          pattern: ^CR\d{20}$
        recipient_phone:
          type:
            - string
            - 'null'
          pattern: ^(506)?[2678]\d{7}$
        recipient_email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
        amount:
          type: integer
          description: Amount in minor units of the currency. For example, 1000 is equivalent to 10.00.
          minimum: 1
          maximum: 500000000
          example: 1000
        reference:
          type:
            - string
            - 'null'
          maxLength: 100
        description:
          type:
            - string
            - 'null'
          maxLength: 500
      required:
        - source_account_id
        - amount
      title: SendPaymentRequest
    StoreWebhookSubscriptionRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        max_attempts:
          type: integer
          minimum: 1
          maximum: 10
        timeout:
          type: integer
          minimum: 5
          maximum: 120
        events:
          type: array
          items:
            type: string
            enum:
              - payment.created
              - payment.processing
              - payment.completed
              - payment.failed
              - transaction.received
          minItems: 1
        headers:
          type: array
          items:
            type: string
            maxLength: 255
      required:
        - url
        - events
      title: StoreWebhookSubscriptionRequest
    UserResource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        email_verified_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - email
        - email_verified_at
        - created_at
        - updated_at
      title: UserResource
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        url:
          type: string
        events:
          type: array
          items: {}
        active:
          type: boolean
        max_attempts:
          type: integer
        timeout:
          type: integer
        headers:
          type:
            - array
            - 'null'
          items: {}
        last_sent_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
        suspended_at:
          type:
            - string
            - 'null'
          format: date-time
        suspended_reason:
          type:
            - string
            - 'null'
      required:
        - id
        - user_id
        - url
        - events
        - active
        - max_attempts
        - timeout
        - headers
        - last_sent_at
        - created_at
        - updated_at
        - suspended_at
        - suspended_reason
      title: WebhookSubscription
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    AuthenticationException:
      description: Unauthenticated
      content:
        application/json:
          example:
            success: false
            message: Source account is required
            data: null
            errors: {}
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: false
              message:
                type: string
                description: Error overview.
              data:
                type: 'null'
              errors:
