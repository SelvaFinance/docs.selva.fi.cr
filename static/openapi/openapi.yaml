      security:
        - BearerAuth: []
  /api/phone/information/{phone}:
    get:
      operationId: phone.getPhoneInformation
      summary: Verify Phone Is Registered
      tags:
        - Verification
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
            pattern: ^(506)?[2678]\d{7}$
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Phone information retrieved successfully
                  data:
                    type: object
                    properties:
                      phone_number:
                        type: string
                      name:
                        type: string
                      document_number:
                        anyOf:
                          - type: array
                            items: {}
                          - type: string
                      document_type:
                        type: 'null'
                      currency:
                        type: string
                      country_code:
                        type: string
                      entity_name:
                        type: string
                      status:
                        type: string
                    required:
                      - phone_number
                      - name
                      - document_number
                      - document_type
                      - currency
                      - country_code
                      - entity_name
                      - status
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Phone number not found in SINPE registry
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          $ref: '#/components/responses/ValidationException'
      security:
        - BearerAuth: []
  /api/iban/information/{iban}:
    get:
      operationId: iban.getIbanInformation
      summary: Verify IBAN Is Registered
      tags:
        - Verification
      parameters:
        - name: iban
          in: path
          required: true
          schema:
            type: string
            pattern: ^CR\d{20}$
      responses:
        '200':
          description: ''
          content:
            application/json:
