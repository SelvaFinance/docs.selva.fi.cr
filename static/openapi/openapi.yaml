openapi: 3.1.0
info:
  title: SELVA Core API
  version: 0.0.1
  description: |-
    Customer-facing SELVA Core API documentation.

    Authenticated endpoints use Passport bearer tokens. Internal KINDO callback routes are intentionally excluded.
servers:
  - url: https://staging.selva.fi.cr
  - url: https://app.selva.fi.cr
paths:
  /api/user:
    get:
      operationId: user.show
      tags:
        - User
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: User retrieved successfully
                  data:
                    $ref: '#/components/schemas/UserResource'
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
      summary: Get User
      security:
        - BearerAuth: []
  /api/payments:
    post:
      operationId: payment.sendPayment
      summary: Send Payment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPaymentRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      channel:
                        type: string
                      status:
                        type: string
                      channel_reference:
                        type: string
                    required:
                      - id
                      - channel
                      - status
                      - channel_reference
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Payment processing failed
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      security:
        - BearerAuth: []
  /api/payments/validate:
    post:
      operationId: payment.validatePayment
      summary: Validate Payment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPaymentRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Payment data is valid
                  data:
                    type: object
                    properties:
                      channel:
                        type: string
                      fee:
                        type: object
                        properties:
                          value:
                            type: integer
                            description: Amount in minor units of the currency. For example, 1000 is equivalent to 10.00.
                            example: 100
                          currency:
                            type: string
                            example: CRC
                          formatted:
                            type: string
                            example: 1.00 CRC
                        required:
                          - value
                          - currency
                          - formatted
                    required:
                      - channel
                      - fee
                required:
                  - success
                  - message
                  - data
              example:
                success: true
                message: Payment data is valid
                data:
                  channel: pin
                  fee:
                    value: 100
                    currency: CRC
                    formatted: 1.00 CRC
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '409':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          $ref: '#/components/responses/ValidationException'
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Payment validation failed
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      description: Validates payment details without initiating the transaction. Returns validation status and any errors.
      security:
        - BearerAuth: []
  /api/payments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: payment.getPaymentStatus
      summary: Get Payment Details
      tags:
        - Payments
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Payment status retrieved successfully
                  data:
                    $ref: '#/components/schemas/PaymentResource'
                required:
                  - success
                  - message
                  - data
              example:
                success: true
                message: Payment status retrieved successfully
                data:
                  id: 4aebf342-8e69-4712-8cbc-77326bf19660
                  idempotency_key: f80fa916-f435-4003-a772-81b03d5c4162
                  cgp_ref_number: 10739
                  channel_reference: '2026041200001915461001586'
                  sinpe_reference: '2026041237022010000107394'
                  transfer_type: debit
                  status: completed
                  amount:
                    value: 10000
                    currency: CRC
                    formatted: 100.00 CRC
                  fee:
                    value: 100
                    currency: CRC
                    formatted: 1.00 CRC
                  payer:
                    iban: CR41037010700577264928
                    document_number: '3918734189'
                    document_type: 3
                    name: Alice Johnson
                  payee:
                    document_number: '0304930258'
                    document_type: 0
                    name: Bob Smith
                    iban: CR27010400128230020117
                  description: null
                  reference: null
                  error_message: null
                  created_at: '2026-04-13T04:26:48.000000Z'
                  submitted_at: '2026-04-13T04:26:50.000000Z'
                  completed_at: '2026-04-13T04:26:58.000000Z'
                  channel: pin
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          $ref: '#/components/responses/ValidationException'
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Unable to retrieve payment details
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      security:
        - BearerAuth: []
  /api/payments/history:
    get:
      operationId: payment.getPaymentHistory
      summary: Get Historical Transfers
      tags:
        - Payments
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: channel
          in: query
          schema:
            type:
              - string
              - 'null'
            enum:
              - pin
              - sinpe_movil
        - name: transfer_type
          in: query
          schema:
            type:
              - string
              - 'null'
            enum:
              - debit
              - credit
        - name: recipient_document_number
          in: query
          schema:
            anyOf:
              - $ref: '#/components/schemas/DocumentIdentifier'
              - type: 'null'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Payment history retrieved successfully
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        minimum: 1
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PaymentResource'
                      first_page_url:
                        type:
                          - string
                          - 'null'
                      from:
                        type:
                          - integer
                          - 'null'
                        minimum: 1
                      last_page:
                        type: integer
                        minimum: 1
                      last_page_url:
                        type:
                          - string
                          - 'null'
                      links:
                        type: array
                        description: Generated paginator links.
                        items:
                          type: object
                          properties:
                            url:
                              type:
                                - string
                                - 'null'
                            label:
                              type: string
                            page:
                              type:
                                - integer
                                - 'null'
                              minimum: 1
                            active:
                              type: boolean
                          required:
                            - url
                            - label
                            - page
                            - active
                      next_page_url:
                        type:
                          - string
                          - 'null'
                      path:
                        type:
                          - string
                          - 'null'
                        description: Base path for paginator generated URLs.
                      per_page:
                        type: integer
                        description: Number of items shown per page.
                        minimum: 0
                      prev_page_url:
                        type:
                          - string
                          - 'null'
                      to:
                        type:
                          - integer
                          - 'null'
                        description: Number of the last item in the slice.
                        minimum: 1
                      total:
                        type: integer
                        description: Total number of items being paginated.
                        minimum: 0
                    required:
                      - current_page
                      - data
                      - first_page_url
                      - from
                      - last_page
                      - last_page_url
                      - links
                      - next_page_url
                      - path
                      - per_page
                      - prev_page_url
                      - to
                      - total
                required:
                  - success
                  - message
                  - data
              example:
                success: true
                message: Payment history retrieved successfully
                data:
                  current_page: 1
                  data:
                    - id: 4aebf342-8e69-4712-8cbc-77326bf19660
                      idempotency_key: f80fa916-f435-4003-a772-81b03d5c4162
                      cgp_ref_number: 10739
                      channel_reference: '2026041200001915461001586'
                      sinpe_reference: '2026041237022010000107394'
                      transfer_type: debit
                      status: completed
                      amount:
                        value: 10000
                        currency: CRC
                        formatted: 100.00 CRC
                      fee:
                        value: 100
                        currency: CRC
                        formatted: 1.00 CRC
                      payer:
                        iban: CR41037010700577264928
                        document_number: '3918734189'
                        document_type: 3
                        name: Alice Johnson
                      payee:
                        document_number: '0304930258'
                        document_type: 0
                        name: Bob Smith
                        iban: CR27010400128230020117
                      description: null
                      reference: null
                      error_message: null
                      created_at: '2026-04-13T04:26:48.000000Z'
                      submitted_at: '2026-04-13T04:26:50.000000Z'
                      completed_at: '2026-04-13T04:26:58.000000Z'
                      channel: pin
                    - id: 80c530a1-4f79-485d-bc0d-5c560d8ff300
                      idempotency_key: 6f19de2e-f9f0-4d4b-86cd-819bcfc024f2
                      cgp_ref_number: 10680
