  /api/payments/service-status:
    get:
      operationId: payment.getServiceStatus
      summary: Get Service Status
      tags:
        - Payments
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Service status retrieved successfully
                  data:
                    type: object
                    properties:
                      pin_service:
                        type: object
                        properties:
                          available:
                            type: boolean
                          status:
                            type: string
                            enum:
                              - online
                              - offline
                        required:
                          - available
                          - status
                      sinpe_service:
                        type: object
                        properties:
                          available:
                            type: boolean
                          status:
                            type: string
                            enum:
                              - online
                              - offline
                        required:
                          - available
                          - status
                      overall_status:
                        type: string
                        enum:
                          - online
                          - partial
                          - offline
                    required:
                      - pin_service
                      - sinpe_service
                      - overall_status
                required:
                  - success
                  - message
                  - data
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Unable to check service status
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      security: []
  /api/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: account.show
      tags:
        - Account
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Account retrieved successfully
                  data:
                    $ref: '#/components/schemas/AccountDetailsResource'
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Account not found
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          $ref: '#/components/responses/ValidationException'
        '503':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Unable to retrieve account balance
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      summary: Get Account
      security:
        - BearerAuth: []
  /api/accounts:
    get:
      operationId: account.index
      tags:
        - Account
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Accounts retrieved successfully
                  data:
                    type: array
                    items: {}
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        '503':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Unable to retrieve account balance
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      summary: List Accounts
      security:
        - BearerAuth: []
    post:
      operationId: account.store
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Account created successfully
                  data:
                    $ref: '#/components/schemas/AccountResource'
                required:
                  - success
                  - message
                  - data
              example:
                success: true
                message: Account created successfully
                data:
                  id: 45a03920-6826-48cc-8141-46995bdbd201
                  iban: CR09037010700634070547
                  currency: CRC
                  created_at: '2026-04-13T05:42:59.000000Z'
                  updated_at: '2026-04-13T05:42:59.000000Z'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
      summary: Create Account
      security:
        - BearerAuth: []
