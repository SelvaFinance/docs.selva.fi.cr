openapi: 3.1.0
info:
  title: SELVA Core API
  version: 0.0.1
  description: |-
    Customer-facing SELVA Core API documentation.

    Authenticated endpoints use Passport bearer tokens. Internal KINDO callback routes are intentionally excluded.
servers:
  - url: https://staging.selva.fi.cr
  - url: https://app.selva.fi.cr
paths:
  /api/user:
    get:
      operationId: user.show
      tags:
        - User
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: User retrieved successfully
                  data:
                    $ref: '#/components/schemas/UserResource'
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
      summary: Get User
      security:
        - BearerAuth: []
  /api/payments:
    post:
      operationId: payment.sendPayment
      summary: Send Payment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPaymentRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      channel:
                        type: string
                      status:
                        type: string
                      channel_reference:
                        type: string
                    required:
                      - id
                      - channel
                      - status
                      - channel_reference
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Payment processing failed
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      security:
        - BearerAuth: []
  /api/payments/validate:
    post:
      operationId: payment.validatePayment
      summary: Validate Payment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPaymentRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Payment data is valid
                  data:
                    type: object
                    properties:
                      channel:
                        type: string
                      fee:
                        type: object
                        properties:
                          value:
                            type: integer
                            description: Amount in minor units of the currency. For example, 1000 is equivalent to 10.00.
                            example: 1000
                          currency:
                            type: string
                          formatted:
                            type: string
                        required:
                          - value
                          - currency
                          - formatted
                    required:
                      - channel
                      - fee
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '409':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          $ref: '#/components/responses/ValidationException'
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Payment validation failed
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      description: Validates payment details without initiating the transaction. Returns validation status and any errors.
      security:
        - BearerAuth: []
  /api/payments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: payment.getPaymentStatus
      summary: Get Payment Details
      tags:
        - Payments
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Payment status retrieved successfully
                  data:
                    $ref: '#/components/schemas/PaymentResource'
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          $ref: '#/components/responses/ValidationException'
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Unable to retrieve payment details
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      security:
        - BearerAuth: []
  /api/payments/history:
    get:
      operationId: payment.getPaymentHistory
      summary: Get Historical Transfers
      tags:
        - Payments
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: channel
          in: query
          schema:
            type:
              - string
              - 'null'
            enum:
              - pin
              - sinpe_movil
        - name: transfer_type
          in: query
          schema:
            type:
              - string
              - 'null'
            enum:
              - debit
              - credit
        - name: recipient_document_number
          in: query
          schema:
            type:
              - string
              - 'null'
            pattern: ^(CR\d{20}|(506)?[2678]\d{7}|((0[1-9]|[1-9])\d{8}|1\d{11}|5\d{11}|3\d{9}))$
            maxLength: 255
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Payment history retrieved successfully
                  data:
                    type: array
                    items: {}
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
      security:
        - BearerAuth: []
  /api/payments/service-status:
    get:
      operationId: payment.getServiceStatus
      summary: Get Service Status
      tags:
        - Payments
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Service status retrieved successfully
                  data:
                    type: object
                    properties:
                      pin_service:
                        type: object
                        properties:
                          available:
                            type: boolean
                          status:
                            type: string
                            enum:
                              - online
                              - offline
                        required:
                          - available
                          - status
                      sinpe_service:
                        type: object
                        properties:
                          available:
                            type: boolean
                          status:
                            type: string
                            enum:
                              - online
                              - offline
                        required:
                          - available
                          - status
                      overall_status:
                        type: string
                        enum:
                          - online
                          - partial
                          - offline
                    required:
                      - pin_service
                      - sinpe_service
                      - overall_status
                required:
                  - success
                  - message
                  - data
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Unable to check service status
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      security: []
  /api/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: account.show
      tags:
        - Account
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Account retrieved successfully
                  data:
                    $ref: '#/components/schemas/AccountDetailsResource'
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Account not found
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          $ref: '#/components/responses/ValidationException'
        '503':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Unable to retrieve account balance
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      summary: Get Account
      security:
        - BearerAuth: []
  /api/accounts:
    get:
      operationId: account.index
      tags:
        - Account
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Accounts retrieved successfully
                  data:
                    type: array
                    items: {}
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        '503':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Unable to retrieve account balance
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      summary: List Accounts
      security:
        - BearerAuth: []
    post:
      operationId: account.store
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Account created successfully
                  data:
                    $ref: '#/components/schemas/AccountResource'
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
      summary: Create Account
      security:
        - BearerAuth: []
  /api/accounts/{id}/balance:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: account.balance
      tags:
        - Account
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Balance retrieved successfully
                  data:
                    $ref: '#/components/schemas/AccountWithBalanceResource'
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Account not found
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          $ref: '#/components/responses/ValidationException'
        '503':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Unable to retrieve account balance
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      summary: Get Account Balance
      security:
        - BearerAuth: []
  /api/phone/information/{phone}:
    get:
      operationId: phone.getPhoneInformation
      summary: Verify Phone Is Registered
      tags:
        - Verification
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
            pattern: ^(506)?[2678]\d{7}$
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Phone information retrieved successfully
                  data:
                    type: object
                    properties:
                      phone_number:
                        type: string
                      name:
                        type: string
                      document_number:
                        anyOf:
                          - type: array
                            items: {}
                          - type: string
                      document_type:
                        type: 'null'
                      currency:
                        type: string
                      country_code:
                        type: string
                      entity_name:
                        type: string
                      status:
                        type: string
                    required:
                      - phone_number
                      - name
                      - document_number
                      - document_type
                      - currency
                      - country_code
                      - entity_name
                      - status
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Phone number not found in SINPE registry
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          $ref: '#/components/responses/ValidationException'
      security:
        - BearerAuth: []
  /api/iban/information/{iban}:
    get:
      operationId: iban.getIbanInformation
      summary: Verify IBAN Is Registered
      tags:
        - Verification
      parameters:
        - name: iban
          in: path
          required: true
          schema:
            type: string
            pattern: ^CR\d{20}$
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: IBAN information retrieved successfully
                  data:
                    type: object
                    properties:
                      iban:
                        type: string
                      name:
                        type: string
                      document_number:
                        type: string
                      document_type:
                        type: string
                      currency:
                        type: string
                      country_code:
                        type: string
                      entity_name:
                        type: string
                      status:
                        type:
                          - string
                          - 'null'
                    required:
                      - iban
                      - name
                      - document_number
                      - document_type
                      - currency
                      - country_code
                      - entity_name
                      - status
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: IBAN not found
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          $ref: '#/components/responses/ValidationException'
      security:
        - BearerAuth: []
  /api/webhooks/subscriptions/{id}:
    get:
      operationId: webhookSubscription.show
      summary: Get Webhook
      tags:
        - Webhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Webhook subscription retrieved successfully
                  data:
                    type:
                      - object
                      - 'null'
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Webhook subscription not found
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Validation failed
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      security:
        - BearerAuth: []
    delete:
      operationId: webhookSubscription.destroy
      summary: Delete Webhook
      tags:
        - Webhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Webhook subscription deleted successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                      events:
                        type: string
                      max_attempts:
                        type: string
                      timeout:
                        type: string
                      headers:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                      - id
                      - url
                      - events
                      - max_attempts
                      - timeout
                      - headers
                      - created_at
                      - updated_at
                required:
                  - success
                  - message
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Webhook subscription not found
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '422':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Validation failed
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Failed to delete webhook subscription
                  data:
                    type: 'null'
                  errors:
                    anyOf:
                      - type: object
                      - type: string
                required:
                  - success
                  - message
                  - data
                  - errors
      security:
        - BearerAuth: []
  /api/webhooks/subscriptions:
    get:
      operationId: webhookSubscription.index
      summary: List Webhooks
      tags:
        - Webhook
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    const: Webhook subscriptions retrieved successfully
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        minimum: 1
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookSubscription'
                      first_page_url:
                        type:
                          - string
                          - 'null'
                      from:
                        type:
                          - integer
                          - 'null'
                        minimum: 1
                      last_page_url:
                        type:
                          - string
                          - 'null'
                      last_page:
                        type: integer
                        minimum: 1
                      links:
                        type: array
                        description: Generated paginator links.
                        items:
                          type: object
                          properties:
                            url:
                              type:
                                - string
                                - 'null'
                            label:
                              type: string
                            active:
                              type: boolean
                          required:
                            - url
                            - label
                            - active
                      next_page_url:
                        type:
                          - string
                          - 'null'
                      path:
                        type:
                          - string
                          - 'null'
                        description: Base path for paginator generated URLs.
                      per_page:
                        type: integer
                        description: Number of items shown per page.
                        minimum: 0
                      prev_page_url:
                        type:
                          - string
                          - 'null'
                      to:
                        type:
                          - integer
                          - 'null'
                        description: Number of the last item in the slice.
                        minimum: 1
                      total:
                        type: integer
                        description: Total number of items being paginated.
                        minimum: 0
                    required:
                      - current_page
                      - data
                      - first_page_url
                      - from
                      - last_page_url
                      - last_page
                      - links
